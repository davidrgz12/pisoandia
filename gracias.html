<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias — Grupo Tomé</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #F6F2EC;
      --dark:       #191512;
      --gold:       #B8945A;
      --gold-light: #D4B07E;
      --gray:       #8A837A;
      --serif:      'Cormorant Garamond', Georgia, serif;
      --sans:       'DM Sans', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--sans);
      font-weight: 300;
      overflow: hidden;
    }

    .page {
      position: relative;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 40px 32px;
    }

    .bg {
      position: absolute; inset: 0;
      background: url('https://raw.githubusercontent.com/davidrgz12/pisoandia/master/fotos/Grupo%20Tom%C3%A9%20-%20Andia%2011%20-%202dcha%20-%20Donostia%20-%20041.jpg') center 60% / cover no-repeat;
    }
    .overlay {
      position: absolute; inset: 0;
      background: rgba(15,11,8,0.78);
    }

    .content {
      position: relative; z-index: 2;
      max-width: 560px;
      animation: fadeup 0.9s ease both;
    }

    @keyframes fadeup {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }

    .logo {
      height: 32px; opacity: 0.9;
      margin-bottom: 56px;
    }
    .logo-text {
      font-family: var(--serif);
      font-size: 16px; font-weight: 400;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 56px;
      display: block;
    }

    .eyebrow {
      font-family: var(--sans);
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.26em; text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 20px;
      display: block;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(52px, 8vw, 88px);
      font-weight: 300;
      line-height: 1.0;
      color: #fff;
      margin-bottom: 24px;
    }

    p {
      font-size: 15px;
      line-height: 1.85;
      color: rgba(255,255,255,0.6);
      max-width: 400px;
      margin: 0 auto 48px;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 12px;
      font-family: var(--sans); font-size: 11px; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--dark);
      background: var(--gold);
      border: none;
      padding: 18px 40px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--gold-light); }
    .btn svg { width: 14px; height: 14px; fill: currentColor; }

    .divider {
      width: 1px; height: 48px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2), transparent);
      margin: 0 auto 48px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg"></div>
    <div class="overlay"></div>

    <div class="content">
      <img src="https://raw.githubusercontent.com/davidrgz12/pisoandia/master/logo.png"
           class="logo" alt="Grupo Tomé"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <span class="logo-text" style="display:none">Grupo Tomé</span>

      <span class="eyebrow">Solicitud recibida</span>
      <h1>Gracias</h1>

      <div class="divider"></div>

      <p>Nos pondremos en contacto contigo en breve para organizar tu visita privada a esta propiedad exclusiva.</p>

      <a href="/" class="btn">
        Seguir descubriendo la vivienda
        <svg viewBox="0 0 16 16"><path d="M8 0l-1.4 1.4 5.6 5.6H0v2h12.2l-5.6 5.6L8 16l8-8z"/></svg>
      </a>
    </div>
  </div>
</body>
</html>
